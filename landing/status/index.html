<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVK Explorer status</title>
<meta name="description" content="Service status for AVK Explorer (placeholder).">
<style>
  :root { --bg:#f6f7f9; --fg:#14181f; --muted:#5a6472; --accent:#2457d6; --ok:#1a7f4b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --fg:#e8ebf0; --muted:#98a2b3; --accent:#7aa2ff; --ok:#4cc38a; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:34rem; }
  h1 { font-size:1.75rem; line-height:1.2; margin:0 0 .75rem; }
  .ok { color:var(--ok); font-weight:600; }
  p { margin:0 0 1rem; color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Status</h1>
  <p class="ok">All systems operational (placeholder)</p>
  <p>This page is a placeholder. Live monitoring arrives in a later phase.</p>
  <p><a href="/">Back to AVK Explorer</a></p>

</body>
</html>
