<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AVK Explorer</title>
<meta name="description" content="AVK Explorer: apps in the works.">
<style>
  :root { --bg:#f6f7f9; --fg:#14181f; --muted:#5a6472; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1218; --fg:#e8ebf0; --muted:#98a2b3; --accent:#7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:34rem; }
  h1 { font-size:2.25rem; line-height:1.15; margin:0 0 .5rem; letter-spacing:-.02em; }
  p { margin:0 0 1rem; color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>AVK Explorer</h1>
  <p>Apps in the works.</p>
  <p><a href="/status/">Service status</a></p>
</main>
</body>
</html>
