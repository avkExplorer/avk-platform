name: __APP__
port: 8080
health: {live: /healthz, ready: /readyz}
smoke:
# [[if web]]
  - {path: /, expect: 200}
# [[end]]
  - {path: /api/v1/ping, expect: 200, contains: "pong"}
env:
# [[if db]]
  - SPRING_DATASOURCE_URL
  - SPRING_DATASOURCE_USERNAME
  - SPRING_DATASOURCE_PASSWORD
# [[end]]
# [[if auth]]
  - OIDC_ISSUER                    # the OIDC_* values come from `avk auth client`
  - OIDC_INTERNAL_ISSUER
  - OIDC_CLIENT_ID
  - OIDC_CLIENT_SECRET
# [[end]]
# [[if web]]
  - SMTP_HOST                      # the SMTP_* values come from `avk legal smtp`
  - SMTP_PORT
  - SMTP_SSL
  - SMTP_USERNAME
  - SMTP_PASSWORD
  - MAIL_FROM
  - SUPPORT_TO
# [[end]]
# [[if web]]
host_truststore: true   # the deployer mounts this PC's Java truststore (Norton re-signs mail TLS to Resend); see the platform's SECURITY.md
# [[end]]
# [[if db]]
migrations: {tool: flyway, command: ["java", "-jar", "/app/app.jar", "--migrate-only"]}
# [[end]]
build: ["cmd", "/c", ".\\check.cmd"]   # optional: local PC build that produces what the Dockerfile packages (avk stg up --build)
# [[if web]]

# Policy pages, cookie notice, contact page and security.txt are generated by `avk legal render __APP__` (platform repo).
# They are a DRAFT, not legal advice, until the owner sets reviewed: true. Anything missing renders as [TO COMPLETE].
legal:
  reviewed: false
  app_title: __APP__
  legal_name: AVK Explorer            # placeholder: put the real person or business name here
  postal_address: ""                  # PO box or virtual address; never a home address
  effective_date: ""                  # owner sets it when the pages are reviewed
# [[if auth]]
  accounts: true
# [[end]]
# [[if noauth]]
  accounts: false
# [[end]]
  regions: [tx]
  analytics: []                       # none: the banner is a one-time notice about essential cookies only
  processors: [cloudflare, resend]
  data_collected: [Messages you send through the contact form]
  data_location: "A computer in Texas, USA, plus encrypted backups held by Cloudflare in the United States"
  retention: ""                       # owner to decide
  sells_goods: false
  subscriptions: false
  physical_goods: false
  footer_into: [src/main/resources/static/index.html]
# [[end]]
