# Local run for development: the app plus a throwaway PostgreSQL, bound to 127.0.0.1 only.
# Started by run-local.cmd (builds the jar first). Not used by the pipeline or by prod.
name: __APP__-local
services:
# [[if db]]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: __APP__
      POSTGRES_PASSWORD: local-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d __APP__"]
      interval: 3s
      timeout: 3s
      retries: 20
# [[end]]
  app:
    build: .
# [[if db]]
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/__APP__
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: local-dev-only
# [[end]]
    ports:
      - "127.0.0.1:__STG_PORT__:8080"
