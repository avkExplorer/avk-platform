name: __APP__
port: 8080
health: {live: /healthz, ready: /readyz}
smoke:
  - {path: /, expect: 200}
  - {path: /healthz, expect: 200, contains: "up"}
# A static site has no database, no login settings and no secrets, so there is nothing to list under `env` and nothing to migrate.
env: []

# Policy pages, cookie notice, contact page (a mailto link: a static site has no form handler) and security.txt are generated by
# `avk legal render __APP__` (platform repo). They are a DRAFT, not legal advice, until the owner sets reviewed: true.
# Anything missing renders as [TO COMPLETE].
legal:
  reviewed: false
  app_title: __APP__
  legal_name: AVK Explorer            # placeholder: put the real person or business name here
  postal_address: ""                  # PO box or virtual address; never a home address
  effective_date: ""                  # owner sets it when the pages are reviewed
  accounts: false
  contact_form: false
  regions: [tx]
  analytics: []                       # none: the banner is a one-time notice about essential cookies only
  processors: [cloudflare]
  data_collected: [Messages and details you send us by email]
  data_location: "A computer in Texas, USA, plus encrypted backups held by Cloudflare in the United States"
  retention: ""                       # owner to decide
  sells_goods: false
  subscriptions: false
  physical_goods: false
  output_dir: __SITE__/legal
  well_known_dir: __SITE__/.well-known
  footer_into: [__SITE__/index.html]
