# Registry of apps on the AVK platform. Public: never put secrets or personal details here.
# `avk` is the only writer once `avk new-app` exists (Phase 8). Rules: `avk validate` (cli/avk/config.py).
domain: avkaiexplorer.com
github_owner: avkExplorer

# The ONLY place signing identities are stored. The deployer (Phase 4) trusts an image only if its build signature
# AND the owner's approval attestation carry exactly these identities. `{ref}` expands to each entry of allowed_refs.
# Confirmed from a real certificate on 2026-11-24 (SAN ends in @refs/heads/main). Pin to a commit SHA in Phase 8.
signing:
  issuer: https://token.actions.githubusercontent.com
  build_identity: https://github.com/avkExplorer/avk-platform/.github/workflows/release.yml@{ref}
  approval_identity: https://github.com/avkExplorer/avk-platform/.github/workflows/approve.yml@{ref}
  approval_predicate_type: https://avkaiexplorer.com/attestations/prod-approval/v1
  allowed_refs: [refs/heads/main]

# Hosts the platform itself serves (Terraform makes a DNS record and tunnel route for each).
platform_hosts:
  - auth.avkaiexplorer.com   # shared login (Keycloak); admin paths and the master realm are blocked here (Phase 5)

apps:
  - name: hello             # pilot service (Spring Boot); a test container serves its hostname until Phase 4
    type: web
    stg_port: 4820
    repo: avkExplorer/hello
    hosts: [hello.avkaiexplorer.com]
    status: stg
