# AVK login theme: Keycloak's own PatternFly v2 login theme + our colours, wordmark and footer.
# Change the look in resources/css/avk.css (the colour variables at the top). To use the real logo, replace
# resources/img/logo.svg and set --avk-logo-url there (RUNBOOK: "change the login branding").
parent=keycloak.v2
styles=css/styles.css css/avk.css

# Footer links (see footer.ftl). The pages themselves are added in Phase 6 (legal).
avkTermsUrl=https://avkaiexplorer.com/terms
avkPrivacyUrl=https://avkaiexplorer.com/privacy
avkSupportEmail=support@avkaiexplorer.com
