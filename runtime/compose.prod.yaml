# Prod stack (project avk-prod). Started by `avk prod up`; AVK_HOME_SLASH is set by avk (C:/avk).
# Nothing here listens on the router: cloudflared dials OUT to Cloudflare, Traefik is reachable only on the
# private network and on 127.0.0.1:4900 for local smoke tests. All images are pinned by digest.

name: avk-prod

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  cloudflared:
    <<: *hardened
    image: cloudflare/cloudflared@sha256:e613aadbc2d9511785d2e67a86b0c8ac18dd63a3f9af0d06faf04cbfdcb35f2d # 2026.11.1
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run", "--token-file", "/run/secrets/tunnel_token"]
    secrets: [tunnel_token]
    networks: [prod]
    depends_on:
      traefik: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5

  traefik:
    <<: *hardened
    image: traefik@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d # 3.6.25
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.ping.address=:8082
      - --ping=true
      - --ping.entrypoint=ping
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      - --accesslog=true
      - --accesslog.format=json
      - --log.format=json
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      - "127.0.0.1:4900:80"
    # Routes live in a named volume (written by the deployer through a throwaway container). A Windows folder does not
    # work here: Docker Desktop does not deliver file-change events from NTFS, so Traefik never saw route changes.
    volumes:
      - type: volume
        source: routes
        target: /dynamic
        read_only: true
    networks: [prod]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=:8082"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5

  # The production database. No host port: only containers on the private avk-prod network can reach it
  # (the deployer's migration container and the app colours). Data lives in a named volume on the internal disk.
  pg-prod:
    <<: *hardened
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    # The image entrypoint starts as root only to fix ownership of the data volume, then drops to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_admin_password
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets: [pg_admin_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    networks: [prod]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 768m
    cpus: 1.0

secrets:
  tunnel_token:
    file: ${AVK_HOME_SLASH}/secrets/platform/tunnel.token
  pg_admin_password:
    file: ${AVK_HOME_SLASH}/secrets/prod/postgres-admin.password

volumes:
  pgdata:
    name: avk-prod-pgdata
  routes:
    name: avk-prod-routes

networks:
  prod:
    name: avk-prod
